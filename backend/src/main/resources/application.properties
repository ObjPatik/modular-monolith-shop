server.port=8080

# Database Configuration
# Read from environment variables (never committed to git)
# Fallback to in-memory H2 in PostgreSQL compatibility mode for offline testing / development
spring.datasource.url=${SPRING_DATASOURCE_URL:${SUPABASE_DB_URL:jdbc:h2:mem:shopdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${SUPABASE_DB_USER:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD:}}
# Driver class name is auto-detected from the JDBC URL (PostgreSQL for Supabase, H2 for local fallback)
# spring.datasource.driver-class-name can be overridden if needed via SPRING_DATASOURCE_DRIVER_CLASS_NAME

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Logging
logging.level.edu.cit.verano=INFO
